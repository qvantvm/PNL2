seed: 42
artifacts_dir: artifacts
data:
  raw_dir: data/raw
  processed_dir: data/processed
  split_by: document
tokenizer:
  mode: atomic
  normalize_enharmonics: false
  preserve_pitch_spelling: true
  preserve_source_spans: true
model:
  objective: cbow
  embedding_dim: 64
  sparse_embeddings: false
context:
  policy: hybrid
  min_window: 1
  max_window: 4
  include_same_event: true
  same_event_weight: 0.25
  sequential_event_weight: 1.0
  simultaneous_event_weight: 1.0
  same_measure_weight: 0.5
training:
  epochs: 5
  batch_size: 512
  learning_rate: 0.003
  negative_samples: 5
  optimizer: adamw
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  early_stopping_patience: 3
  device: auto
  num_workers: 0
logging:
  log_every_steps: 50
  save_every_epochs: 1
